<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R3 Store | Order Received</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
  --red: #1a6bbf;
  --red-dark: #145299;
  --red-light: #2282e8;
  --white: #ffffff;
  --dark: #0a0a0a;
  --card-bg: #141414;
  --green: #25d366;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--dark); }
::-webkit-scrollbar-thumb { background: var(--red); border-radius: 2px; }

body {
  font-family: 'Cairo', sans-serif;
  background: var(--dark);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
}

/* ── background grid lines ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(26,107,191,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,107,191,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── glow blob ── */
body::after {
  content: '';
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(37,211,102,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  animation: pulse 4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  50%       { transform: translate(-50%,-50%) scale(1.15); opacity: 0.7; }
}

/* ── card ── */
.card {
  position: relative;
  z-index: 1;
  background: var(--card-bg);
  border: 1px solid #1e1e1e;
  border-radius: 24px;
  padding: 40px 28px 36px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  animation: fadeUp 0.55s cubic-bezier(.23,1,.32,1) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* top accent line */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
  border-radius: 0 0 2px 2px;
}

/* ── brand ── */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 28px;
}
.brand-logo {
  height: 40px;
  object-fit: contain;
  margin-bottom: 4px;
}
.brand-fallback {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.6rem;
  font-weight: 900;
  letter-spacing: 6px;
  color: #fff;
  line-height: 1;
}
.brand-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.55rem;
  letter-spacing: 5px;
  color: var(--red);
  font-weight: 700;
  margin-top: 2px;
}

/* ── check icon ── */
.check-wrap {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(37,211,102,0.1);
  border: 2px solid rgba(37,211,102,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 22px;
  animation: popIn 0.5s 0.3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.check-wrap i {
  font-size: 2rem;
  color: var(--green);
}

/* ── heading ── */
.heading {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--green);
  text-transform: uppercase;
  margin-bottom: 6px;
  animation: fadeUp 0.5s 0.35s both;
}
.sub-heading {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 4px;
  color: #444;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 22px;
  animation: fadeUp 0.5s 0.4s both;
}

/* ── message box ── */
.msg-box {
  background: #0d0d0d;
  border: 1px solid #1a1a1a;
  border-radius: 14px;
  padding: 18px 16px;
  margin-bottom: 22px;
  animation: fadeUp 0.5s 0.45s both;
}
.msg-box p {
  font-size: 0.88rem;
  color: #888;
  line-height: 1.8;
}
.msg-box strong {
  color: #bbb;
}

/* ── steps ── */
.steps {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 26px;
  text-align: right;
  animation: fadeUp 0.5s 0.5s both;
}
.step {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: #0d0d0d;
  border: 1px solid #1a1a1a;
  border-radius: 12px;
}
.step-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(26,107,191,0.15);
  border: 1px solid rgba(26,107,191,0.3);
  color: var(--red-light);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.step-text {
  font-size: 0.82rem;
  color: #777;
  line-height: 1.4;
}

/* ── divider ── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, #1e1e1e, transparent);
  margin-bottom: 22px;
}

/* ── back button ── */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  justify-content: center;
  padding: 14px 24px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-family: 'Cairo';
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.25s, transform 0.2s;
  animation: fadeUp 0.5s 0.55s both;
  letter-spacing: 1px;
}
.back-btn:hover {
  background: var(--red-light);
  transform: translateY(-1px);
}
.back-btn i { font-size: 0.85rem; }

/* ── order id ── */
.order-id {
  margin-top: 16px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 3px;
  color: #333;
  text-transform: uppercase;
  animation: fadeUp 0.5s 0.6s both;
}
</style>
</head>
<body>

<div class="card">

  <!-- Brand -->
  <div class="brand">
    <img class="brand-logo" src="logo.png"
         onerror="this.style.display='none';document.getElementById('brand-fallback').style.display='block'">
    <div class="brand-fallback" id="brand-fallback" style="display:none">R3</div>
    <div class="brand-sub">DIGITAL GAME STORE</div>
  </div>

  <!-- Check -->
  <div class="check-wrap">
    <i class="fas fa-check"></i>
  </div>

  <div class="heading">ORDER RECEIVED</div>
  <div class="sub-heading">تم استلام طلبك بنجاح</div>

  <!-- Message -->
  <div class="msg-box">
    <p>
      وصلنا طلبك وصورة الدفع بنجاح! 🎉<br>
      هيتم <strong>التواصل معاك على الواتساب</strong><br>
      في أقرب وقت ممكن.
    </p>
  </div>

  <!-- Steps -->
  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">تم استلام طلبك وصورة الدفع ✅</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">هنتحقق من الدفع ونجهز حسابك 🔄</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">هنتواصل معاك على الواتساب بتفاصيل الحساب 📲</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Back button -->
  <a href="/index.html" class="back-btn">
    <i class="fas fa-arrow-right"></i>
    الرجوع للمتجر
  </a>

  <div class="order-id">R3 STORE · EGYPT · 2025</div>
</div>

</body>
</html>
