<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>R3 Admin Console</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#070b14;--card:#0d1424;--line:#1b2640;--ac:#1a6bbf;--cy:#22d3ee;--tx:#e8eefc;--mu:#7d8bab;--red:#ef4444;--gr:#22c55e;--or:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit}
.hide{display:none!important}
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;width:100%;max-width:360px}
.logo{font-weight:900;letter-spacing:2px;font-size:1.3rem}.logo b{color:var(--cy)}.logo small{display:block;color:var(--cy);font-size:.65rem;letter-spacing:3px}
input,select,textarea{width:100%;background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:.88rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cy)}
label{display:block;font-size:.72rem;color:var(--mu);margin:10px 0 4px;font-weight:700}
.btn{background:var(--ac);border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:.85rem}
.btn.g{background:#12203a;border:1px solid var(--line)}.btn.r{background:#3b1216;color:#fca5a5}.btn:disabled{opacity:.5}
#app{display:flex}
aside{width:250px;background:#0a1020;border-left:1px solid var(--line);min-height:100vh;position:fixed;right:0;top:0;bottom:0;padding:18px 14px;display:flex;flex-direction:column;gap:6px;z-index:50;transition:.25s}
aside .logo{padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.nav{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid transparent;background:none;color:var(--mu);font-weight:700;cursor:pointer;text-align:right;font-size:.9rem}
.nav.on{background:#0f2a44;border-color:var(--cy);color:#fff}
main{flex:1;margin-right:250px;padding:18px;min-width:0}
.top{display:none;align-items:center;gap:10px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:1.5rem;display:block}.stat span{font-size:.72rem;color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:10px 0}.chip{flex-shrink:0;padding:7px 13px;border-radius:50px;background:var(--card);border:1px solid var(--line);color:var(--mu);font-size:.78rem;font-weight:700;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.row img,.ph{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#0a1020;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.row .i{flex:1;min-width:0}.row .n{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .p{font-size:.72rem;color:var(--mu);margin-top:2px}
.row select{width:auto;padding:6px 8px;font-size:.7rem;border-radius:10px}
.ic{background:#12203a;border:1px solid var(--line);border-radius:10px;width:34px;height:34px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{width:90px;height:90px;border-radius:12px;object-fit:cover;background:#0a1020}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12203a;border:1px solid var(--cy);padding:10px 18px;border-radius:50px;font-size:.82rem;z-index:300}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
@media(max-width:800px){aside{transform:translateX(100%)}aside.open{transform:none}main{margin-right:0}.top{display:flex}.sheet{max-width:100%}}
@media(min-width:801px){.modal{align-items:center}.sheet{border-radius:20px}}
</style></head><body>
<div id="login"><div class="box"><div class="logo">R3 <b>STORE</b><small>ADMIN CONSOLE</small></div>
<label>الإيميل</label><input id="em" type="email" autocomplete="username"><label>الباسورد</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
<button class="btn" style="width:100%;margin-top:16px" onclick="login()">دخول</button><p id="lerr" style="color:var(--red);font-size:.75rem;margin-top:10px"></p></div></div>

<div id="app" class="hide">
<aside id="side"><div class="logo">R3 <b>STORE</b><small>ADMIN CONSOLE</small></div>
<button class="nav on" data-s="dash" onclick="go('dash')">📊 الرئيسية</button>
<button class="nav" data-s="prods" onclick="go('prods')">🎮 المنتجات</button>
<button class="nav" data-s="orders" onclick="go('orders')">🧾 الطلبات <span id="nb" class="hide" style="background:var(--red);border-radius:50px;padding:0 7px;font-size:.7rem"></span></button>
<button class="nav" data-s="custs" onclick="go('custs')">👥 العملاء</button>
<button class="nav" data-s="bulk" onclick="go('bulk')">💰 تعديل أسعار جماعي</button>
<div style="flex:1"></div>
<a class="nav" href="index.html" target="_blank" style="text-decoration:none">↗ فتح الموقع</a>
<button class="nav" onclick="logout()">🚪 خروج</button></aside>
<main>
<div class="top"><button class="ic" onclick="toggleSide()">☰</button><div class="logo">R3 <b>ADMIN</b></div></div>

<section id="dash"><h2 style="margin-bottom:12px">الرئيسية</h2><div class="grid" id="stats"></div><div id="oos"></div></section>

<section id="prods" class="hide"><div style="display:flex;gap:8px"><input id="q" placeholder="🔍 بحث باسم المنتج" oninput="renderList()"><button class="btn" onclick="openForm()">＋ إضافة</button></div>
<div class="chips" id="chips"></div><div id="list"></div></section>

<section id="orders" class="hide"><h2 style="margin-bottom:10px">الطلبات</h2><input id="oq" placeholder="🔍 رقم العميل" oninput="renderOrders()"><div class="chips" id="ochips"></div><div id="olist"></div></section>
<section id="custs" class="hide"><h2 style="margin-bottom:10px">العملاء</h2><input id="cq" placeholder="🔍 رقم العميل" oninput="renderCusts()"><div id="clist" style="margin-top:10px"></div></section>
<section id="bulk" class="hide"><h2 style="margin-bottom:6px">تعديل أسعار جماعي</h2><p style="color:var(--mu);font-size:.78rem">زوّد أو نزّل كل أسعار قسم بنسبة (مثلاً 5 أو -10). بيتقرب لأقرب 5 جنيه.</p>
<label>القسم</label><select id="bc"></select><label>النسبة %</label><input id="bp" type="number" step="0.5" placeholder="مثلاً 5 أو -10">
<button class="btn" style="margin-top:14px" onclick="bulkApply()">تطبيق</button></section>
</main></div>

<div id="mod" class="modal hide" onclick="if(event.target===this)closeForm()"><div class="sheet">
<h3 id="mt" style="margin-bottom:6px">منتج</h3>
<label>القسم</label><select id="f_category" onchange="showFields()"></select>
<label>الاسم</label><input id="f_name">
<div class="two"><div><label>النوع (Genre)</label><input id="f_genre"></div><div><label>الحجم</label><input id="f_size" placeholder="مثلاً 50 GB"></div></div>
<label>الوصف</label><textarea id="f_description" rows="3"></textarea>
<div class="two"><div><label>الحالة</label><select id="f_stock"><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option><option>NEW!! Stock</option></select></div><div><label>أيقونة (إيموجي)</label><input id="f_icon" value="🎮"></div></div>
<div id="pf" class="two"></div>
<label>الصورة</label>
<div style="display:flex;gap:10px;align-items:center"><img id="pv" class="prev hide"><div style="flex:1"><input type="file" id="file" accept="image/*" onchange="upImg(this)"><input id="f_img" placeholder="أو لينك / اسم ملف" style="margin-top:6px" oninput="pvShow()"></div></div>
<button class="btn g" style="margin-top:8px;font-size:.72rem" onclick="f_img.value='';pvShow()">🗑 شيل الصورة</button>
<div style="display:flex;gap:8px;margin-top:18px"><button class="btn" style="flex:1" id="sv" onclick="save()">حفظ</button><button class="btn g" onclick="closeForm()">إلغاء</button></div>
</div></div>
<div id="toast" class="hide"></div>

<script>
const SUPABASE_URL='PASTE_SUPABASE_URL', SUPABASE_ANON_KEY='PASTE_SUPABASE_ANON_KEY';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const CATS={psn:['PlayStation (PSN)',['ps5','ps4','sec']],psplus:['PS Plus',['ps5','ps4']],fortnite:['Fortnite / شحن',['price']],daily:['عروض اليوم',['price']],mycustomid:['اشتراكات / Streaming',['price']],gta:['GTA Online',['price']],pcxbox:['PC & Xbox',['home','sign']],rent:['إيجار',['price']]};
const PL={ps5:'سعر PS5',ps4:'سعر PS4',sec:'سعر SEC',price:'السعر',home:'Xbox Home',sign:'Digital / PC'};
const $=id=>document.getElementById(id);let rows=[],cat='all',editId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),2500)}
async function login(){$('lerr').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){$('lerr').textContent='❌ بيانات غلط';return}init()}
async function logout(){await sb.auth.signOut();location.reload()}
async function init(){const{data}=await sb.auth.getSession();if(!data.session)return;$('login').classList.add('hide');$('app').classList.remove('hide');
 const o=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');$('f_category').innerHTML=o;$('bc').innerHTML=o;await load()}
let orders=[],ost='all';
async function load(){const{data,error}=await sb.from('products').select('*').order('sort').order('id');if(error){toast('❌ '+error.message);return}rows=data;await loadOrders();renderChips();renderList()}
async function loadOrders(){const{data}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(1000);orders=data||[];renderDash();renderOrders();renderCusts();const n=orders.filter(o=>o.status==='new').length;$('nb').textContent=n;$('nb').classList.toggle('hide',!n)}
function go(s){['dash','prods','orders','custs','bulk'].forEach(x=>$(x).classList.toggle('hide',x!==s));document.querySelectorAll('.nav[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));$('side').classList.remove('open');if($('ov'))$('ov').remove()}
function toggleSide(){const s=$('side');s.classList.toggle('open');if(s.classList.contains('open')){const d=document.createElement('div');d.id='ov';d.onclick=()=>{s.classList.remove('open');d.remove()};document.body.appendChild(d)}else if($('ov'))$('ov').remove()}
function renderDash(){const out=rows.filter(r=>r.stock==='Out of Stock');
 $('stats').innerHTML=`<div class="stat"><b style="color:var(--or)">${orders.filter(o=>o.status==='new').length}</b><span>طلبات جديدة</span></div><div class="stat"><b style="color:var(--gr)">${orders.filter(o=>o.status==='done').reduce((s,o)=>s+Number(o.total),0).toLocaleString()}</b><span>مبيعات مكتملة (ج)</span></div><div class="stat"><b>${new Set(orders.map(o=>o.phone)).size}</b><span>عملاء</span></div><div class="stat"><b>${rows.length}</b><span>إجمالي المنتجات</span></div><div class="stat"><b style="color:var(--red)">${out.length}</b><span>خلصت من المخزون</span></div>`+Object.entries(CATS).map(([k,v])=>`<div class="stat"><b>${rows.filter(r=>r.category===k).length}</b><span>${v[0]}</span></div>`).join('');
 $('oos').innerHTML=out.length?'<h3 style="margin:8px 0">خلصانة</h3>'+out.map(r=>`<div class="row"><div class="i"><div class="n">${esc(r.name)}</div><div class="p">${CATS[r.category][0]}</div></div><button class="btn g" onclick="setStock(${r.id},'In Stock')">رجّع متاح</button></div>`).join(''):''}
function renderChips(){$('chips').innerHTML=[['all','الكل']].concat(Object.entries(CATS).map(([k,v])=>[k,v[0]])).map(([k,l])=>`<div class="chip ${cat===k?'on':''}" onclick="cat='${k}';renderChips();renderList()">${l}</div>`).join('')}
function priceTxt(r){return CATS[r.category][1].map(k=>r[k]!=null?`${PL[k].replace('سعر ','')}: ${Number(r[k]).toLocaleString()}`:null).filter(Boolean).join(' • ')||'بدون سعر'}
function renderList(){const q=$('q').value.trim().toLowerCase();const l=rows.filter(r=>(cat==='all'||r.category===cat)&&(!q||r.name.toLowerCase().includes(q)));
 $('list').innerHTML=l.map(r=>`<div class="row">${r.img?`<img src="${esc(r.img)}" onerror="this.outerHTML='<div class=ph>${esc(r.icon)}</div>'">`:`<div class="ph">${esc(r.icon)}</div>`}<div class="i"><div class="n">${esc(r.name)}</div><div class="p">${priceTxt(r)}</div></div>
 <select onchange="setStock(${r.id},this.value)">${['In Stock','Low Stock','Out of Stock','NEW!! Stock'].map(s=>`<option ${r.stock===s?'selected':''}>${s}</option>`).join('')}</select>
 <button class="ic" onclick="openForm(${r.id})">✏️</button><button class="ic" onclick="del(${r.id})">🗑</button></div>`).join('')||'<p style="color:var(--mu);text-align:center;margin-top:30px">مفيش منتجات</p>'}
async function setStock(id,v){const{error}=await sb.from('products').update({stock:v,updated_at:new Date()}).eq('id',id);if(error)return toast('❌ '+error.message);rows.find(r=>r.id===id).stock=v;renderDash();renderList();toast('✅ اتحفظ')}
function showFields(){const c=$('f_category').value;const cur=editId?rows.find(r=>r.id===editId):{};$('pf').innerHTML=CATS[c][1].map(k=>`<div><label>${PL[k]}</label><input type="number" id="p_${k}" value="${cur&&cur[k]!=null&&cur.category===c?cur[k]:''}" placeholder="فاضي = N/A"></div>`).join('')}
function pvShow(){const v=$('f_img').value.trim();$('pv').classList.toggle('hide',!v);if(v)$('pv').src=v}
function openForm(id){editId=id||null;const r=id?rows.find(x=>x.id===id):null;$('mt').textContent=r?'تعديل منتج':'إضافة منتج';
 $('f_category').value=r?r.category:(cat!=='all'?cat:'psn');['name','genre','size','description','icon','img'].forEach(k=>$('f_'+k).value=r?(r[k]??''):(k==='icon'?'🎮':''));$('f_stock').value=r?r.stock:'In Stock';showFields();pvShow();$('mod').classList.remove('hide')}
function closeForm(){$('mod').classList.add('hide')}
function shrink(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/webp',.85)};im.src=URL.createObjectURL(file)})}
async function upImg(inp){const f=inp.files[0];if(!f)return;toast('⏳ برفع الصورة...');const b=await shrink(f);const path=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.webp';
 const{error}=await sb.storage.from('product-images').upload(path,b,{contentType:'image/webp',cacheControl:'31536000'});if(error)return toast('❌ '+error.message);
 $('f_img').value=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;pvShow();inp.value='';toast('✅ اترفعت')}
async function save(){const c=$('f_category').value,name=$('f_name').value.trim();if(!name)return toast('اكتب الاسم');
 const o={category:c,name,genre:$('f_genre').value.trim()||null,size:$('f_size').value.trim()||null,description:$('f_description').value.trim()||null,icon:$('f_icon').value.trim()||'🎮',img:$('f_img').value.trim()||null,stock:$('f_stock').value,updated_at:new Date()};
 ['ps5','ps4','sec','home','sign','price'].forEach(k=>{const e=$('p_'+k);o[k]=e&&e.value!==''?Number(e.value):null});
 if(!editId){const m=rows.filter(r=>r.category===c).map(r=>r.sort);o.sort=m.length?Math.min(...m)-1:0}
 $('sv').disabled=true;const{error}=editId?await sb.from('products').update(o).eq('id',editId):await sb.from('products').insert(o);$('sv').disabled=false;
 if(error)return toast('❌ '+error.message);closeForm();await load();toast('✅ اتحفظ')}
async function del(id){const r=rows.find(x=>x.id===id);if(!confirm('تمسح "'+r.name+'" ؟'))return;const{error}=await sb.from('products').delete().eq('id',id);if(error)return toast('❌ '+error.message);await load();toast('🗑 اتمسح')}
async function bulkApply(){const p=Number($('bp').value);if(!p)return toast('اكتب النسبة');const c=$('bc').value;if(!confirm(`${p>0?'زيادة':'خصم'} ${Math.abs(p)}% على كل ${CATS[c][0]} ؟`))return;
 const up=rows.filter(r=>r.category===c).map(r=>{const o={id:r.id,category:r.category,name:r.name};CATS[c][1].forEach(k=>o[k]=r[k]!=null?Math.round(r[k]*(1+p/100)/5)*5:null);return o});
 const{error}=await sb.from('products').upsert(up);if(error)return toast('❌ '+error.message);await load();toast('✅ اتعدلت '+up.length+' منتج')}
const ST={new:['جديد','var(--or)'],processing:['جاري التنفيذ','var(--cy)'],done:['تم','var(--gr)'],cancelled:['ملغي','var(--red)']};
const wa=p=>{p=String(p).replace(/\D/g,'');if(p.startsWith('0'))p='20'+p.slice(1);return 'https://wa.me/'+p};
const dt=d=>new Date(d).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
function renderOrders(){$('ochips').innerHTML=[['all','الكل']].concat(Object.entries(ST).map(([k,v])=>[k,v[0]])).map(([k,l])=>`<div class="chip ${ost===k?'on':''}" onclick="ost='${k}';renderOrders()">${l}</div>`).join('');
 const q=$('oq').value.trim();const l=orders.filter(o=>(ost==='all'||o.status===ost)&&(!q||o.phone.includes(q)));
 $('olist').innerHTML=l.map(o=>`<div class="row" style="flex-wrap:wrap"><div class="i" style="flex-basis:100%"><div class="n" style="white-space:normal">${(o.items||[]).map(i=>esc(i.name)).join(' + ')}</div><div class="p">${dt(o.created_at)} • <b dir="ltr">${esc(o.phone)}</b> • ${Number(o.total).toLocaleString()} ج • ${esc(o.account_type||'')} • ${esc(o.payment_method||'')}${o.discount_code?' • كود: '+esc(o.discount_code):''}</div></div>
 <select onchange="setOS(${o.id},this.value)" style="color:${ST[o.status][1]}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v[0]}</option>`).join('')}</select>
 ${o.proof_path?`<button class="ic" title="صورة الدفع" onclick="proof('${esc(o.proof_path)}')">📷</button>`:''}<a class="ic" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="${wa(o.phone)}" target="_blank">💬</a><button class="ic" onclick="delO(${o.id})">🗑</button></div>`).join('')||'<p style="color:var(--mu);text-align:center;margin-top:30px">مفيش طلبات</p>'}
async function setOS(id,v){const{error}=await sb.from('orders').update({status:v}).eq('id',id);if(error)return toast('❌ '+error.message);orders.find(o=>o.id===id).status=v;renderDash();renderOrders();renderCusts();const n=orders.filter(o=>o.status==='new').length;$('nb').textContent=n;$('nb').classList.toggle('hide',!n);toast('✅ اتحفظ')}
async function proof(p){const{data,error}=await sb.storage.from('payment-proofs').createSignedUrl(p,3600);if(error)return toast('❌ '+error.message);window.open(data.signedUrl,'_blank')}
async function delO(id){if(!confirm('تمسح الطلب ده؟'))return;const o=orders.find(x=>x.id===id);const{error}=await sb.from('orders').delete().eq('id',id);if(error)return toast('❌ '+error.message);if(o.proof_path)await sb.storage.from('payment-proofs').remove([o.proof_path]);await loadOrders();toast('🗑 اتمسح')}
function renderCusts(){const m={};orders.forEach(o=>{const c=m[o.phone]||(m[o.phone]={phone:o.phone,n:0,sum:0,last:o.created_at});c.n++;if(o.status!=='cancelled')c.sum+=Number(o.total);if(o.created_at>c.last)c.last=o.created_at});
 const q=$('cq').value.trim();const l=Object.values(m).filter(c=>!q||c.phone.includes(q)).sort((a,b)=>b.sum-a.sum);
 $('clist').innerHTML=l.map(c=>`<div class="row"><div class="ph">👤</div><div class="i"><div class="n" dir="ltr" style="text-align:right">${esc(c.phone)}</div><div class="p">${c.n} طلب • ${c.sum.toLocaleString()} ج • آخر طلب ${dt(c.last)}</div></div><button class="ic" title="طلباته" onclick="$('oq').value='${esc(c.phone)}';ost='all';go('orders');renderOrders()">🧾</button><a class="ic" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="${wa(c.phone)}" target="_blank">💬</a></div>`).join('')||'<p style="color:var(--mu);text-align:center;margin-top:30px">مفيش عملاء لسه</p>'}
setInterval(()=>{if(!$('app').classList.contains('hide'))loadOrders()},60000);
init();
</script></body></html>
